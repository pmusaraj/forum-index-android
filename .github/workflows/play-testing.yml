name: Publish Play testing

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      track:
        default: internal
        type: string
      verify_access:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag containing a signed AAB
        required: true
        type: string
      track:
        description: Testing track ID (must be in PLAY_TEST_TRACKS)
        default: internal
        required: true
        type: string
      verify_access:
        description: Only check Google Play access (no upload or release changes)
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

# Play allows only one edit per app at a time, even across tracks.
concurrency:
  group: play-com-musaraj-forumindex
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check configuration and download bundle
        env:
          TAG: ${{ inputs.tag }}
          TRACK: ${{ inputs.track }}
          PLAY_TEST_TRACKS: ${{ vars.PLAY_TEST_TRACKS || 'internal' }}
          PROVIDER: ${{ vars.PLAY_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          VERIFY_ACCESS: ${{ inputs.verify_access }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -n "$PROVIDER" || { echo 'Configure PLAY_WIF_PROVIDER'; exit 1; }
          test -n "$SERVICE_ACCOUNT" || { echo 'Configure PLAY_SERVICE_ACCOUNT'; exit 1; }
          python3 scripts/publish-play-testing.py --tag "$TAG" --track "$TRACK" --check-inputs
          if [[ "$VERIFY_ACCESS" == true ]]; then exit 0; fi
          mkdir -p "$RUNNER_TEMP/play"
          gh release download "$TAG" --pattern "forum-index-$TAG.aab" --pattern SHA256SUMS --dir "$RUNNER_TEMP/play"
      - name: Authenticate to Google Play
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Upload and release to testing
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          TAG: ${{ inputs.tag }}
          TRACK: ${{ inputs.track }}
          PLAY_TEST_TRACKS: ${{ vars.PLAY_TEST_TRACKS || 'internal' }}
          VERIFY_ACCESS: ${{ inputs.verify_access }}
        run: |
          if [[ "$VERIFY_ACCESS" == true ]]; then
            python3 scripts/publish-play-testing.py --tag "$TAG" --track "$TRACK" --check-access
            exit 0
          fi
          python3 scripts/publish-play-testing.py --tag "$TAG" --track "$TRACK" \
            --bundle "$RUNNER_TEMP/play/forum-index-$TAG.aab" \
            --checksums "$RUNNER_TEMP/play/SHA256SUMS"
